[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nhanes_reliable"
version = "0.1.0"
description = "Mortality risk from a wrist wearable and clinical data when parts are missing (NHANES 2011-2014)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

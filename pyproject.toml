[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nhanes_reliable"
version = "0.1.0"
description = "Mortality risk from a wrist wearable and clinical data when parts are missing (NHANES 2011-2014)"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "results", "figures", "checkpoints", "notes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# B905: zip() without strict= is intentional. RUF001-003: the text uses typographic symbols (−, ×, –) on purpose.
ignore = ["B905", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Scripts set thread limits or the import path before importing numpy and the package.
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["nhanes_reliable"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true

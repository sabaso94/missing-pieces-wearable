name: tests

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU build of PyTorch)
        run: |
          python -m pip install -U pip
          pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
          grep -v -E '^torch(vision)?==' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt -r requirements-dev.txt
          pip install -e .
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q
